# PaxofiCloud behind Nginx (staging/production).
# - /health/* and /api/* go to the PHP front controller (public/index.php is
#   the only executable file; security headers are set by the application).
# - Everything else is the static customer-portal build in /app/web, with a
#   single-page-app fallback to index.html.
server_tokens off;

# The only way in is cloudflared on the host (no inbound ports, threat model
# D-05), so the client address Cloudflare reports can be trusted from it.
set_real_ip_from 127.0.0.1;
set_real_ip_from 172.16.0.0/12;
real_ip_header CF-Connecting-IP;

server {
    listen 8080;
    server_name _;
    root /app/web;

    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;

    location ~ /\. {
        deny all;
        return 404;
    }

    location ~ ^/(health|api)(/|$) {
        root /app/public;
        try_files /index.php =404;
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 35s;
    }

    # Content-hashed build output: cache for a year.
    location /assets/ {
        include /etc/nginx/snippets/web-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        limit_except GET HEAD { deny all; }
        include /etc/nginx/snippets/web-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
