# PaxofiCloud behind Nginx (staging/production).
# - /health/* and /api/* go to the PHP front controller (public/index.php is
#   the only executable file; security headers are set by the application).
# - POST /webhooks/paystack and /webhooks/flutterwave go to payments-web, the
#   only PHP process for them (payments threat model PY-7).
# - Everything else is the static customer-portal build in /app/web, with a
#   single-page-app fallback to index.html.
# - The staff admin host (admin.<domain> or <name>-admin.<domain>) has its own
#   server block: /admin-api/* goes to PHP and pages fall back to admin.html.
#   The customer host never serves admin.html or /admin-api (identity threat
#   model §6.19); the API also refuses /admin-api on any other host (§6.18).
server_tokens off;

# The only way in is cloudflared on the host (no inbound ports, threat model
# D-05), so the client address Cloudflare reports can be trusted from it.
set_real_ip_from 127.0.0.1;
set_real_ip_from 172.16.0.0/12;
real_ip_header CF-Connecting-IP;

server {
    listen 8080;
    server_name _;
    root /app/web;

    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;

    location ~ /\. {
        deny all;
        return 404;
    }

    # The staff console only exists on the admin host.
    location ~ ^/(admin-api(/|$)|admin\.html$) {
        return 404;
    }

    # Gateway webhooks (payments threat model PY-7): exactly two paths, POST
    # only, 64 KiB, answered by payments-web, never by the web tier.
    location ~ ^/webhooks/(paystack|flutterwave)$ {
        limit_except POST { deny all; }
        client_max_body_size 64k;
        root /app/public;
        try_files /index.php =404;
        fastcgi_pass payments-web:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 15s;
    }

    location /webhooks/ {
        return 404;
    }

    location ~ ^/(health|api)(/|$) {
        root /app/public;
        try_files /index.php =404;
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 35s;
    }

    # Content-hashed build output: cache for a year.
    location /assets/ {
        include /etc/nginx/snippets/web-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        limit_except GET HEAD { deny all; }
        include /etc/nginx/snippets/web-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}

# Staff admin console (SRS ACC-005, IAM-008). cloudflared keeps the original
# Host header; the PHP admin guard checks it against ADMIN_URL again.
server {
    listen 8080;
    server_name ~^(admin|[a-z0-9-]+-admin)\.[a-z0-9.-]+$;
    root /app/web;

    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;

    location ~ /\. {
        deny all;
        return 404;
    }

    # The customer API is not served on the admin host, and the customer
    # portal page is not either.
    location ~ ^/(api(/|$)|index\.html$) {
        return 404;
    }

    location ~ ^/(health|admin-api)(/|$) {
        root /app/public;
        try_files /index.php =404;
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 35s;
    }

    location /assets/ {
        include /etc/nginx/snippets/admin-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        limit_except GET HEAD { deny all; }
        include /etc/nginx/snippets/admin-security-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /admin.html =404;
    }
}
