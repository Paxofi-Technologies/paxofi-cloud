# PaxofiCloud API behind Nginx (staging/production). Only public/index.php is
# executable; every request is routed to it. Security headers are set by the
# application.
server_tokens off;

# The only way in is cloudflared on the host (no inbound ports, threat model
# D-05), so the client address Cloudflare reports can be trusted from it.
set_real_ip_from 127.0.0.1;
set_real_ip_from 172.16.0.0/12;
real_ip_header CF-Connecting-IP;

server {
    listen 8080;
    server_name _;
    root /app/public;

    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;

    location ~ /\. {
        deny all;
        return 404;
    }

    location / {
        try_files /index.php =404;
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 35s;
    }
}
