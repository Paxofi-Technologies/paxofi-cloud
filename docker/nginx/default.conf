# PaxofiCloud API behind Nginx. Only public/index.php is executable; every
# request is routed to it. Security headers are set by the application.
server_tokens off;

server {
    listen 8080;
    server_name _;
    root /app/public;

    # Matches the application's 1 MiB body limit (APP_MAX_BODY_BYTES).
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;

    # Never serve dotfiles or anything that is not the front controller.
    location ~ /\. {
        deny all;
        return 404;
    }

    location / {
        try_files /index.php =404;
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 35s;
    }
}
