[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
listen = 9000
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
; Kill stuck requests rather than letting them pile up.
request_terminate_timeout = 35s
; Pass container environment (DB_*, REDIS_*) through to PHP.
clear_env = no
access.log = /dev/null
catch_workers_output = yes
decorate_workers_output = no
