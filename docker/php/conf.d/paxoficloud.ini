; Hardened PHP settings shared by every environment (SRS SEC-013).
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL

; Matches APP_MAX_BODY_BYTES (1 MiB) with headroom for multipart overhead.
post_max_size = 2M
upload_max_filesize = 1M
max_input_vars = 1000
memory_limit = 256M
max_execution_time = 30

; No remote file access or URL includes.
allow_url_include = Off
allow_url_fopen = Off

; Sessions are handled by the application in Redis (Sprint 1), never by PHP.
session.auto_start = 0
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax

date.timezone = UTC
default_charset = UTF-8
zend.assertions = -1

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Development re-reads changed files; production sets this to 0.
opcache.validate_timestamps = 1
