name: PaxofiCloud Quality Baseline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paxoficloud-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sodium, pdo_mysql, mbstring
          tools: composer
          coverage: none
        env:
          fail-fast: true

      - name: Validate repository whitespace
        run: git diff --check

      - name: Validate Composer manifest and lock
        run: composer validate --no-check-publish

      - name: Lint PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find src tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Install dependencies
        shell: bash
        env:
          # Read-only token (Contents: read on paxofi-core-framework only).
          PCF_READ_TOKEN: ${{ secrets.PCF_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${PCF_READ_TOKEN}" ]; then
            composer config --global github-oauth.github.com "${PCF_READ_TOKEN}"
            composer install --no-interaction --no-progress --prefer-dist
            echo "PCF_MODE=locked" >> "$GITHUB_ENV"
          else
            # The private PCF package cannot be resolved without a token. Resolve
            # everything else so unit tests and static analysis still run; any code
            # that already depends on PCF will fail analysis loudly here.
            echo "::warning title=PCF not resolved::Secret PCF_READ_TOKEN is not configured; dependencies installed without paxofi-core-framework."
            composer remove --no-interaction --no-update paxofi-technologies/paxofi-core-framework
            composer update --no-interaction --no-progress --prefer-dist
            echo "PCF_MODE=standalone" >> "$GITHUB_ENV"
          fi

      - name: PHPUnit
        run: vendor/bin/phpunit

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G --error-format=github

      - name: Composer audit
        run: composer audit --no-interaction

      - name: Summary
        if: always()
        run: echo "PCF dependency mode: ${PCF_MODE:-unknown}" >> "$GITHUB_STEP_SUMMARY"

  php-85:
    name: PHP 8.5 compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: sodium, mbstring
          tools: composer
          coverage: none

      - name: Install dependencies
        shell: bash
        env:
          PCF_READ_TOKEN: ${{ secrets.PCF_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${PCF_READ_TOKEN}" ]; then
            composer config --global github-oauth.github.com "${PCF_READ_TOKEN}"
            composer install --no-interaction --no-progress --prefer-dist
          else
            composer remove --no-interaction --no-update paxofi-technologies/paxofi-core-framework
            composer update --no-interaction --no-progress --prefer-dist
          fi

      - name: PHPUnit
        run: vendor/bin/phpunit
