name: PaxofiCloud Quality Baseline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - chore/paxoficloud-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paxoficloud-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer, phpstan:2.2.8
          coverage: none
        env:
          fail-fast: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
        continue-on-error: true

      - name: Validate repository whitespace
        run: git diff --check

      - name: Validate PHP analysis configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f phpstan.neon.dist
          phpstan --version

      - name: Validate PHP files when present
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find . -type f -name '*.php' -not -path './.git/*' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No PHP source files present; PHP syntax and static analysis execution deferred until PHP implementation exists."
            exit 0
          fi
          for file in "${files[@]}"; do
            php -l "$file"
          done

      - name: Run PHPStan when PHP source is present
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f -name '*.php' -not -path './.git/*' -print -quit | grep -q .; then
            phpstan analyse --configuration=phpstan.neon.dist --error-format=github --no-progress
          else
            echo "PHPStan configuration validated; no PHP source exists yet."
          fi

      - name: Validate Composer manifest when present
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f composer.json ]; then
            echo "No composer.json present; Composer validation skipped."
            exit 0
          fi
          composer validate --no-check-publish

      - name: Validate Node package when present
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            echo "No package.json present; Node validation skipped."
            exit 0
          fi
          node --version
          npm --version
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          else
            npm install --package-lock=false --ignore-scripts
          fi
          npm run lint --if-present
          npm test --if-present
